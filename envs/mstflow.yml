name: mstflow
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Versions are pinned so a different solver result cannot change the toolchain.
  - python=3.10.20
  - fastqc=0.12.1
  - multiqc=1.29
  - fastp=0.24.0
  - adapterremoval=2.3.4
  - bwa=0.7.19
  - kraken2=2.1.6
  - matplotlib=3.10.3
