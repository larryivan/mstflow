name: mstflow-attribution-r
channels:
  - conda-forge
  - nodefaults
dependencies:
  # R and the packages FEAST and FastST need, at the versions in the attribution image
  # (the CRAN snapshot of 2025-02-27). FEAST and npreg, which FastST uses, are not on
  # conda-forge: the workflow builds them from pinned sources with the compilers below
  # (see modules/r_methods_install.nf).
  - r-base=4.4.2
  # OpenBLAS is pinned to the image's release as well: FastST inverts near-singular
  # matrices with eigen(), and which eigenvalues count as zero differs between releases.
  # On a sink with few taxa this changes the estimate; with the same release it does not.
  - libopenblas=0.3.26
  - r-optparse=1.7.5
  - r-rcpp=1.0.14
  - r-rcpparmadillo=14.2.3.1
  - r-vegan=2.6_10
  - r-dplyr=1.1.4
  - r-reshape2=1.4.4
  - r-ggplot2=3.5.1
  - r-cowplot=1.1.3
  - r-ggthemes=5.1.0
  - r-gridextra=2.3
  - compilers=1.10.0
  - make=4.4.1
  - python=3.12.15
