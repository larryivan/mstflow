# A starting point for your own run. Copy it, edit the paths, then:
#
#   nextflow run larryivan/mstflow -profile docker -params-file params.yml
#
# Every other option and its default is in docs/parameters.md.

input: samplesheet.tsv
outdir: results

kraken2_db: /path/to/k2_standard      # prebuilt index; already includes the Bracken files
kraken2_memory: 80 GB                  # at least the size of hash.k2d

host_fasta: /path/to/chm13v2.0.fa     # with its BWA index (.amb .ann .bwt .pac .sa) alongside

# Keep only bacteria and archaea in the filtered tables (needs a matching NCBI taxdump):
# taxon_filter: prokaryote
# taxdump: /path/to/taxdump

# Attribute samples to source environments (needs source_sink and model_source_env columns):
# run_sourcetracker2: true
