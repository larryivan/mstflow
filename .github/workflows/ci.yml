name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib numpy pysam
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.4'
      - run: python -m unittest discover -s tests -v
      - run: bash tests/stub/run.sh

  test-profile:
    name: Real run on test data (${{ matrix.profile }}, Nextflow ${{ matrix.nextflow }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: docker, nextflow: '25.10.4' }
          - { profile: docker, nextflow: 'latest-stable' }
          - { profile: conda, nextflow: '25.10.4' }
    defaults:
      run:
        shell: bash -el {0}
    env:
      NXF_CONDA_CACHEDIR: ${{ github.workspace }}/.conda-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      # Conda runs everything, FEAST and FastST included, from environments built on the runner.
      - if: matrix.profile == 'conda'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - if: matrix.profile == 'conda'
        uses: actions/cache@v4
        with:
          path: ${{ env.NXF_CONDA_CACHEDIR }}
          key: nextflow-conda-${{ hashFiles('envs/*.yml') }}
      - run: nextflow run ${{ github.workspace }} -profile test,${{ matrix.profile }} --outdir results
      - name: Check the outputs
        run: |
          # 18 libraries and 3 mixtures; the bone library is mostly human DNA and is flagged.
          test "$(tail -n +2 results/summary/sample_summary.tsv | wc -l)" -eq 21
          grep -q "^bone.*few_genera" results/summary/sample_summary.tsv
          # Five methods for nine sinks (the meadow soil has too few counts and is left
          # out), each scored by cross-validation.
          test "$(tail -n +2 results/attribution/default/comparison.tsv | wc -l)" -eq 9
          awk -F'\t' 'NR == 1 { for (i = 1; i <= NF; i++) column[$i] = i; next } $column["included"] == "false" { print $1 }' \
            results/attribution/default/inputs/attribution_sample_qc.tsv | grep -qx meadow_soil
          test "$(tail -n +2 results/attribution/default/evaluation/evaluation.tsv | wc -l)" -eq 5
          # The ancient calculus's Arachnia carries damage.
          grep -q "^calculus.*Arachnia.*damaged$" results/authentication/authentication.tsv
          # The mixtures' estimates follow from their components'.
          python3 assets/test/check_mixtures.py results
