name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install matplotlib numpy pysam
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.10.4'
      - run: python -m unittest discover -s tests -v
      - run: bash tests/stub/run.sh

  test-profile:
    name: Real run on test data (Nextflow ${{ matrix.nextflow }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow: ['25.10.4', 'latest-stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.nextflow }}
      - run: nextflow run ${{ github.workspace }} -profile test,docker --outdir results
      - name: Check the outputs
        run: |
          # 15 libraries; the bone library is mostly human DNA and is flagged.
          test "$(tail -n +2 results/summary/sample_summary.tsv | wc -l)" -eq 15
          grep -q "^bone.*few_genera" results/summary/sample_summary.tsv
          # Five methods for three sinks (bone is too shallow and is left out), each
          # scored by cross-validation.
          test "$(tail -n +2 results/attribution/default/comparison.tsv | wc -l)" -eq 3
          awk -F'\t' 'NR == 1 { for (i = 1; i <= NF; i++) column[$i] = i; next } $column["included"] == "false" { print $1 }' \
            results/attribution/default/inputs/attribution_sample_qc.tsv | grep -qx bone
          test "$(tail -n +2 results/attribution/default/evaluation/evaluation.tsv | wc -l)" -eq 5
          # The ancient calculus's Arachnia carries damage.
          grep -q "^calculus.*Arachnia.*damaged$" results/authentication/authentication.tsv
